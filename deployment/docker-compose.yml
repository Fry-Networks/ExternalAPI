version: '3.8'

services:
  fry-external-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - UVICORN_RELOAD=false
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/miners/health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

